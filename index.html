<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Weather App</h1>
    <div class="search">
      <input type="text" id="searchInput" placeholder="Enter city...">
      <button id="searchBtn">Search</button>
      <select id="units">
        <option value="metric">°C, km/h</option>
        <option value="imperial">°F, mph</option>
      </select>
    </div>
  </header>

  <main>
  <section class="card">
    <div class="current-weather-box">
      <div>
        <h2 id="locationName">City, Country</h2>
        <p id="date">Tuesday, Aug 5, 2025</p>
      </div>
      <div class="current-weather-temp" id="currentTemp">20°</div>
    </div>

    <div class="info-grid">
      <div class="info-card">Feels Like <br><span id="feelsLike">18°</span></div>
      <div class="info-card">Humidity <br><span id="humidity">46%</span></div>
      <div class="info-card">Wind <br><span id="wind">14 km/h</span></div>
      <div class="info-card">Precipitation <br><span id="precip">0 mm</span></div>
    </div>
  </section>

  <section class="card">
    <h2>Daily forecast</h2>
    <div class="daily-forecast" id="dailyForecastGrid"></div>
  </section>

  <section class="card">
    <h2>Hourly forecast</h2>
    <div id="daySelector"></div>
    <div class="hourly-forecast" id="hourlyForecastGrid"></div>
  </section>
</main>


  <script src="script.js"></script>
</body>
</html>
