<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Weather App</h1>
    <div class="search">
      <input type="text" id="searchInput" placeholder="Enter city...">
      <button id="searchBtn">Search</button>
      <select id="units">
        <option value="metric">Metric (°C, km/h)</option>
        <option value="imperial">Imperial (°F, mph)</option>
      </select>
    </div>
  </header>

  <main>
    <section class="card" id="current-weather">
      <h2>Current Weather</h2>
      <div id="currentWeatherData"></div>
    </section>

    <section class="card">
      <h2>7-Day Forecast</h2>
      <div id="dailyForecastGrid" class="grid"></div>
    </section>

    <section class="card">
      <h2>Hourly Forecast</h2>
      <div id="daySelector"></div>
      <div id="hourlyForecastGrid" class="grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
